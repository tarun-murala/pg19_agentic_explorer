services:
  ingestion-db:
    image: postgres:15
    container_name: pg19_ingestion_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pg19_ingestion
      POSTGRES_USER: pg19
      POSTGRES_PASSWORD: pg19pass
    ports:
      - "5433:5432"
    volumes:
      - pg19_ingestion_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg19 -d pg19_ingestion"]
      interval: 10s
      timeout: 5s
      retries: 5

  ingestion-service:
    build:
      context: .
      dockerfile: services/ingestion_service/Dockerfile
    container_name: pg19_ingestion_service
    depends_on:
      ingestion-db:
        condition: service_healthy
      qdrant:
        condition: service_started
    env_file:
      - services/ingestion_service/.env.example
    environment:
      INGESTION_DATABASE_URL: postgresql+psycopg://pg19:pg19pass@ingestion-db:5432/pg19_ingestion
      INGESTION_PG19_ROOT: /data/pg19
      INGESTION_VECTOR_HOST: qdrant
      INGESTION_VECTOR_PORT: 6333
      INGESTION_OLLAMA_BASE_URL: http://host.docker.internal:11434
    volumes:
      - ./data/pg19:/data/pg19:ro
    ports:
      - "8001:8001"
    restart: unless-stopped

  orchestrator-service:
    build:
      context: .
      dockerfile: services/orchestrator_service/Dockerfile
    container_name: pg19_orchestrator_service
    depends_on:
      ingestion-service:
        condition: service_started
    env_file:
      - services/orchestrator_service/.env.example
    environment:
      ORCH_INGESTION_SERVICE_URL: http://ingestion-service:8001
      ORCH_KG_SERVICE_URL: http://host.docker.internal:8002
      ORCH_OLLAMA_BASE_URL: http://host.docker.internal:11434
      ORCH_HISTORY_PATH: /data/orchestrator_history.json
    volumes:
      - ./data/orchestrator:/data
    ports:
      - "8000:8000"
    restart: unless-stopped

  kg-builder-service:
    build:
      context: .
      dockerfile: services/kg_builder_service/Dockerfile
    container_name: pg19_kg_builder
    env_file:
      - services/kg_builder_service/.env.example
    environment:
      KG_NEO4J_URI: bolt://neo4j:7687
      KG_OLLAMA_BASE_URL: http://host.docker.internal:11434
    depends_on:
      neo4j:
        condition: service_started
      orchestrator-service:
        condition: service_started
    ports:
      - "8002:8002"
    restart: unless-stopped

  ui-service:
    build:
      context: .
      dockerfile: services/ui/Dockerfile
    container_name: pg19_ui
    depends_on:
      orchestrator-service:
        condition: service_started
      kg-builder-service:
        condition: service_started
    environment:
      ORCHESTRATOR_URL: http://orchestrator-service:8000
      DATASET_DIR: /data/pg19
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./data:/data
    ports:
      - "3000:3000"
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.10.0
    container_name: pg19_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

  neo4j:
    image: neo4j:5.21
    container_name: pg19_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data

volumes:
  pg19_ingestion_data:
  qdrant_data:
  neo4j_data:
